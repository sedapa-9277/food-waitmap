<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맛집 대기지도</title>
  <style>
    :root { --primary: #ff6b2c; --text: #191f28; --text-sub: #6b7684; --line: #e5e8eb; --bg: #f2f4f6; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    main { width: 100%; max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 24px; color: var(--text-sub); line-height: 1.5; }
    a {
      display: block; margin-bottom: 12px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px;
      background: #fff; color: inherit; text-decoration: none;
    }
    a:hover { border-color: var(--primary); }
    a strong { display: block; margin-bottom: 4px; font-size: 17px; }
    a span { color: var(--text-sub); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>⏱ 맛집 대기지도</h1>
    <p>로그인 없이 맛집 대기시간을 확인하고 공유하세요.</p>
    <a href="waitmap/"><strong>실제 지도</strong><span>OpenStreetMap 식당 + 실시간 대기시간 공유</span></a>
    <a href="food/"><strong>퍼블리싱 시안</strong><span>가상 데이터로 보는 UI 시안</span></a>
  </main>
</body>
</html>
